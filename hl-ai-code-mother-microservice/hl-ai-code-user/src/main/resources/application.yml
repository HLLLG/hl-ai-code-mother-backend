spring:
  application:
    name: hl-ai-code-user
  # DataSource Config
  datasource:
    url: jdbc:mysql://localhost:3306/hl_ai_code_mother
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  session:
    store-type: redis
    timeout: 2592000
  # rabbitmq
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
server:
  port: 8124
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi ??
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hl.hlaicodeuser.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
# 用户服务不使用 JD HotKey，避免启动时初始化 etcd 客户端。
hotkey:
  enabled: false
# Dubbo
dubbo:
  registry:
    address: nacos://127.0.0.1:8848?username=nacos&password=nacos
    register-mode: instance
  protocol:
    name: tri
    port: 50051
  consumer:
    timeout: 60000
  provider:
    timeout: 60000
